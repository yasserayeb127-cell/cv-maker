<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Maker - إنشاء سيرتك الذاتية</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #1e293b;
    min-height: 100vh;
}

header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    font-size: 16px;
    opacity: 0.9;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.card h2 {
    margin-bottom: 20px;
    color: #2563eb;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#cv {
    display: none;
}

.cv-header {
    text-align: center;
    border-bottom: 2px solid #2563eb;
    padding-bottom: 20px;
    margin-bottom: 20px;
}

.cv-header h2 {
    font-size: 30px;
    color: #111827;
    margin-bottom: 8px;
}

.cv-header h3 {
    color: #2563eb;
    margin-bottom: 10px;
}

.cv-section {
    margin-bottom: 20px;
}

.cv-section h3 {
    color: #2563eb;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 8px;
    margin-bottom: 10px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 26px;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>✨ CV Maker</h1>
    <p>أنشئ سيرتك الذاتية الاحترافية في دقائق</p>
</header>

<div class="container">

    <div class="card">
        <h2>📝 معلوماتك الشخصية</h2>

        <label>الاسم الكامل</label>
        <input id="name" placeholder="مثال: محمد أحمد">

        <label>المهنة</label>
        <input id="job" placeholder="مثال: مطور مواقع">

        <label>البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="example@email.com">

        <label>نبذة عنك</label>
        <textarea id="about" placeholder="اكتب نبذة قصيرة عن خبرتك ومهاراتك..."></textarea>

        <button onclick="createCV()">إنشاء سيرتي الذاتية 🚀</button>
    </div>

    <div class="card" id="cv">

        <div class="cv-header">
            <h2 id="resultName"></h2>
            <h3 id="resultJob"></h3>
            <p id="resultEmail"></p>
        </div>

        <div class="cv-section">
            <h3>نبذة عني</h3>
            <p id="resultAbout"></p>
        </div>

    </div>

</div>

<footer>
    © 2026 CV Maker — أنشئ مستقبلك المهني
</footer>

<script>
function createCV() {

    const name = document.getElementById("name").value;
    const job = document.getElementById("job").value;
    const email = document.getElementById("email").value;
    const about = document.getElementById("about").value;

    document.getElementById("resultName").innerText = name;
    document.getElementById("resultJob").innerText = job;
    document.getElementById("resultEmail").innerText = email;
    document.getElementById("resultAbout").innerText = about;

    document.getElementById("cv").style.display = "block";

    document.getElementById("cv").scrollIntoView({
        behavior: "smooth"
    });
}
</script>

</body>
</html>
